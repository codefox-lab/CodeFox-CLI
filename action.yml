name: 'CodeFox AI Review'
author: 'CodeFox'
description: '🚀 AI-powered code security and quality audit'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  codefox-api-key:
    description: 'API key used to authenticate requests to the CodeFox service.'
    required: true

  codefox-branch:
    description: 'Git branch of the CodeFox repository to install and run.'
    default: 'main'
    required: false

  github-token:
    description: 'GitHub token used to authenticate with the GitHub API.'
    default: ${{ github.token }}
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore CodeFox cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.codefox/
        key: ${{ runner.os }}-codefox-${{ github.repository }}-${{ github.base_ref }}-${{ inputs.codefox-branch }}
        restore-keys: |
          ${{ runner.os }}-codefox-${{ github.repository }}-${{ github.base_ref }}-
          ${{ runner.os }}-codefox-${{ github.repository }}-
          ${{ runner.os }}-codefox-

    - name: Install CodeFox
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/URLbug/CodeFox-CLI.git@${{ inputs.codefox-branch }}

    - name: Fetch base branch
      shell: bash
      run: |
        git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
        git fetch origin ${{ github.head_ref }}:${{ github.head_ref }}

    - name: Create CodeFox env
      shell: bash
      run: |
        umask 077
        echo "CODEFOX_API_KEY=${{ inputs.codefox-api-key }}" > .codefoxenv
        echo "GITHUB_TOKEN=${{ inputs.github-token }}" >> .codefoxenv
        echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .codefoxenv
        echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> .codefoxenv

    - name: Run CodeFox Scan
      shell: bash
      run: |
        # Without .codefox.yml the scan aborts before anything is posted,
        # which leaves the PR with no review comment at all.
        if [ ! -f .codefox.yml ]; then
          codefox init --provider "${CODEFOX_PROVIDER:-gemini}" \
            --token "codefox-action-placeholder-token" </dev/null >/dev/null 2>&1 || true
        fi

        if [ ! -f .codefox.yml ]; then
          echo "::error::CodeFox could not create .codefox.yml in the repository root."
          exit 1
        fi

        # Embedding the whole checkout is what stalls CI: every chunk costs
        # a CPU embedding on a 2-4 core runner. Unless the repo opted in,
        # cap the index size so the review starts in a bounded time.
        if [ "${CODEFOX_FULL_REPO_RAG:-false}" != "true" ]; then
          CODEFOX_RAG_MAX_CHUNKS="${CODEFOX_RAG_MAX_CHUNKS:-600}"
          CODEFOX_RAG_MAX_FILES="${CODEFOX_RAG_MAX_FILES:-300}"
          export CODEFOX_RAG_MAX_CHUNKS CODEFOX_RAG_MAX_FILES
          python -c "import os, yaml; p = '.codefox.yml'; c = yaml.safe_load(open(p)) or {}; m = c.setdefault('model', {}); m.setdefault('rag_chunk_size', 1000); m.setdefault('rag_chunk_overlap', 200); m.setdefault('rag_max_chunks', int(os.environ['CODEFOX_RAG_MAX_CHUNKS'])); m.setdefault('rag_max_files', int(os.environ['CODEFOX_RAG_MAX_FILES'])); yaml.safe_dump(c, open(p, 'w'), sort_keys=False); print('CodeFox RAG capped at', m['rag_max_chunks'], 'chunks /', m['rag_max_files'], 'files')"
        fi

        codefox scan \
          --target-branch ${{ github.base_ref }} \
          --source-branch ${{ github.head_ref }} \
          --ci
